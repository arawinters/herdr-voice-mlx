name: CI
# PRs only (plus manual runs): a push to a PR branch already triggers pull_request, so a push trigger doubled
# every run. macOS runners are scarce; a newer push to the same PR cancels the run it supersedes.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: swift build -c release
  local-openlive:
    # Type-check, unit tests and build only; nothing here needs macOS.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.22.3, cache: pnpm, cache-dependency-path: local-openlive/pnpm-lock.yaml }
      - run: ./scripts/local-openlive-source
      - run: pnpm install --frozen-lockfile
        working-directory: local-openlive
      - run: pnpm build # syncs the pinned OpenLive source into vendor/, which check and test import
        working-directory: local-openlive
      - run: pnpm check
        working-directory: local-openlive
      - run: pnpm test
        working-directory: local-openlive
